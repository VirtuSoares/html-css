<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Inscrição - Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page-container">
        <section class="form-card">
            <h2>Inscreva-se no Blog</h2>
            <p>Receba os melhores conteúdos de tecnologia e programação diretamente no seu e-mail.</p>

            <form action="#" method="POST" class="signup-form">
                
                <div class="input-row">
                    <div class="input-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
                    </div>

                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="seu.email@exemplo.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="interesse">Área de Interesse</label>
                    <select id="interesse" name="interesse" required>
                        <option value="" disabled selected>Selecione uma opção</option>
                        <option value="frontend">Desenvolvimento Front-end</option>
                        <option value="backend">Desenvolvimento Back-end</option>
                        <option value="data">Análise de Dados</option>
                        <option value="uiux">UI/UX Design</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="frequencia">Frequência da Newsletter</label>
                    <select id="frequencia" name="frequencia">
                        <option value="semanal">Semanal</option>
                        <option value="quinzenal">Quinzenal</option>
                        <option value="mensal">Mensal</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">Quero me Inscrever</button>

            </form>
        </section>
    </main>

</body>
</html>
